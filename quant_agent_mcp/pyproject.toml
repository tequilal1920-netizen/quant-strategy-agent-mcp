[project]
name = "quant-agent-mcp"
version = "0.3.0"
description = "Remote-only quant research MCP client and local device authenticator"
requires-python = ">=3.11"
dependencies = ["mcp==1.27.1", "httpx==0.28.1", "cryptography==46.0.3", "keyring==25.7.0; sys_platform == 'darwin'", "pydantic==2.12.4", "anyio==4.10.0", "psutil==7.0.0"]

[project.scripts]
quant-agent-mcp = "quant_agent_mcp.server:main"
quant-agent-client = "quant_agent_mcp.cli:main"
quant-agent-device = "quant_agent_mcp.device_bridge:main"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_agent_mcp*"]
